name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      # Compile errors show up as annotations on the run, so they are easy to read.
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Execution failed|AAPT|Could not' build.log | head -12 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BT-Chat.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest BT-Chat.apk --target "$GITHUB_SHA" --prerelease \
            --title "BT Chat - latest build" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Install it on both phones."

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BT-Chat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
