name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into the Android project layout
        run: |
          if [ -f MainActivity.kt ]; then
            mkdir -p app/src/main/java/com/example/btchat app/src/main/res/layout app/src/main/res/values gradle/wrapper
            mv "build.gradle (1).kts" app/build.gradle.kts
            mv AndroidManifest.xml app/src/main/
            mv MainActivity.kt BluetoothChatService.kt app/src/main/java/com/example/btchat/
            mv activity_main.xml app/src/main/res/layout/
            mv strings.xml app/src/main/res/values/
            mv gradle-wrapper.properties gradle/wrapper/
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already has the Android SDK preinstalled
      # (ANDROID_HOME), so no separate SDK setup action is needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BT-Chat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
