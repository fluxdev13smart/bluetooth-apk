name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships the Android SDK; just accept its licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Put the real compiler errors into the run's annotations so they can be
      # read without downloading logs.
      - name: Show build errors
        if: failure()
        run: |
          ERR=$(grep -E "^e: |error:|ERROR:|AAPT|Execution failed|What went wrong|Caused by|^> " build.log | cut -c1-400 | head -60 || true)
          ERR="${ERR//'%'/'%25'}"
          ERR="${ERR//$'\r'/'%0D'}"
          ERR="${ERR//$'\n'/'%0A'}"
          echo "::error title=Build errors::${ERR}"

      - uses: actions/upload-artifact@v4
        with:
          name: BT-Chat-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # A plain download link that works straight from a phone browser.
      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BT-Chat.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BT-Chat.apk \
            --target "$GITHUB_SHA" \
            --title "BT Chat (latest build)" \
            --notes "Latest build from commit ${GITHUB_SHA::7}. Download BT-Chat.apk and install it on your phone."
